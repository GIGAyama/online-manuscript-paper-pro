<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="color-scheme" content="light">
  <title>つながっていません｜オンライン原稿用紙 Pro</title>
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    /* この画面はネットにつながっていないときに出る。
       だから外部のフォントもCSSも読みに行かない（読みに行けば当然失敗し、
       「壊れた画面」に見えてしまう）。配色と丸みだけ本体に合わせる。 */
    :root {
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --fs-body:  clamp(15px, 1.6vw + 10px, 18px);
      --fs-title: clamp(22px, 3.2vw + 14px, 34px);
      --blue: #3b82f6;
      --blue-d: #1d4ed8;
      --ink: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #f8fafc;
      color: var(--ink);
      font-size: var(--fs-body);
      line-height: 1.8;
      text-align: center;
      font-family: "Zen Maru Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    }
    .mark {
      width: 88px; height: 88px; border-radius: 24px;
      background: var(--blue); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 700;
      box-shadow: 0 8px 24px rgba(59, 130, 246, .3);
    }
    h1 { margin: 0; font-size: var(--fs-title); }
    p { margin: 0; max-width: 34rem; color: var(--muted); }
    .retry {
      margin-top: 4px;
      min-height: 52px; min-width: 200px;
      padding: 12px 28px;
      border: none; border-radius: 999px;
      background: var(--blue); color: #fff;
      font-size: 1rem; font-weight: 700; font-family: inherit;
      cursor: pointer; touch-action: manipulation;
      box-shadow: 0 4px 14px rgba(59, 130, 246, .35);
    }
    .retry:hover { background: var(--blue-d); }
    .retry:focus-visible { outline: 3px solid var(--blue-d); outline-offset: 3px; }
    .note {
      font-size: .9em;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 14px 18px; max-width: 34rem; text-align: left; color: var(--muted);
    }
    footer { margin-top: 8px; font-size: .8em; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
    @media (forced-colors: active) { .retry { border: 2px solid ButtonText; } }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">✎</div>
  <h1>いま インターネットに つながっていません</h1>
  <p>Wi-Fi が つながっているか たしかめてから、下の ボタンを おしてください。</p>
  <button class="retry" type="button" onclick="location.reload()">もういちど ためす</button>
  <p class="note">
    これまでに 書いた 作文は、この タブレット（パソコン）の 中に のこっています。
    つながると そのまま つづきを 書けます。<br>
    先生と つながる ときだけ インターネットが ひつようです。
  </p>
  <footer>©2026 オンライン原稿用紙 Pro GIGA山</footer>
</body>
</html>
