name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 失敗時にコミットなしで再デプロイできるよう手動実行を許可する
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ビルド（成果物のアップロード）とデプロイをジョブとして分ける。
  # 1つのジョブにまとめていると「Re-run failed jobs」のたびに
  # github-pages という同名の成果物が同じ実行に追加され、
  # actions/deploy-pages が
  #   Multiple artifacts named "github-pages" were unexpectedly found
  # で必ず失敗するようになる（成果物は上書きされないため再実行するほど増える）。
  # 分割しておけば再実行の対象は deploy だけになり、成果物は1つのまま保たれる。
  # 品質ゲート。一度直した項目（manifest の id、sw.js のキャッシュ削除範囲、
  # 100vh の単独使用など）を次の改修で静かに壊し戻していないかを機械的に見張る。
  # ここが落ちたら公開しない。
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: GIGA Standard v4 品質ゲート
        run: node scripts/check-project.mjs

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages側の反映待ちは通常20秒ほどだが、混雑時は数十分キューに残ることがある。
          # 既定の10分では成果物のアップロードに成功していてもタイムアウトで失敗扱いになるため、
          # 待ち時間を30分まで延ばす。
          timeout: 1800000
