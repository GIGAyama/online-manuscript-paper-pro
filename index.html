<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale / user-scalable=no は付けない。
       このアプリは「文章を書いて読み返す」道具であり、小さい字を指で広げて
       確かめる操作が学習そのものに含まれる。誤ズーム防止と引き換えに
       拡大を禁じると、視力の弱い児童と、細かい添削を読む先生が困る。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- インストールの合図を「いちばん先に」受け取る。
       Chrome は条件が揃うと即座に beforeinstallprompt を出す。
       この下にある Tailwind / React / Babel の読み込みより後ろに置くと、
       校内Wi-Fiが混んでいる時にこの合図を取りこぼし、
       画面に「インストール」ボタンが出なくなる。 -->
  <script>
    window.__deferredInstallPrompt = null;
    addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      dispatchEvent(new Event('pwa-installable'));
    });
    addEventListener('appinstalled', function () {
      window.__deferredInstallPrompt = null;
      dispatchEvent(new Event('pwa-installed'));
    });
  </script>

  <meta name="description" content="縦書き原稿用紙で作文が書ける学習アプリ。先生とのリアルタイム添削・AI添削に対応。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GIGA school">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="オンライン原稿用紙 Pro">
  <meta property="og:description" content="縦書き原稿用紙で作文が書ける学習アプリ。先生とのリアルタイム添削・AI添削に対応。">
  <meta property="og:url" content="https://online-manuscript-paper-pro.giga-school.com/">
  <meta property="og:image" content="https://giga-school.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#3b82f6">
  <!-- 児童が使う画面なので配色は固定する。端末のダークモード設定で
       原稿用紙の色が変わると、印刷結果と見え方がずれて混乱する。 -->
  <meta name="color-scheme" content="light">
  <title>オンライン原稿用紙 Pro</title>
  <link rel="icon" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iOS は maskable アイコンに対応しないため専用の1枚を渡す -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="原稿用紙Pro">

  <!--
    === ライブラリ・アイコン・書体（すべて自己ホスト）===
    生成物です。作り直すには npm ci && npm run build（書体は npm run build:fonts）。

    ⚠️ ここに CDN への <script> / <link> を戻さないこと。
       学校のフィルタが 1 本でも塞ぐと、画面が白いまま何も出ません。
       児童からは「壊れている」としか見えず、原因はアプリの外にあるので
       先生も追えません。

    ⚠️ @babel/standalone（約3MB）はもう読みません。JSX は npm run build が
       ビルド時に 1 回だけ翻訳します（原本は src/app.jsx）。

    ⚠️ 書体は本文（Zen Maru Gothic 500）と原稿（Shippori Mincho 400）の
       2 つだけにしました。Zen Old Mincho は Shippori Mincho の控えとして
       名前が並んでいるだけなので、取りこんでいません。
       収録は小学1〜2年の配当漢字までで、児童が打った珍しい字は
       端末フォントに落ちます（豆腐にはなりません）。
  -->
  <link rel="stylesheet" href="./css/fonts.css">
  <link rel="stylesheet" href="./vendor/icons.css">
  <link rel="stylesheet" href="./css/app.css">
  <script src="./vendor/libs.js"></script>

  <!-- デザインシステムの原本は tailwind.config.js に移しました。
       生成物は css/app.css です（Tailwind の出力＋ tools/extra.css）。 -->


  <script>
    // ソフトキーボードが出ると window.innerHeight は変わらないのに
    // 実際に見えている領域だけが縮む。原稿用紙は画面いっぱいに広げているので、
    // これを放置すると入力中のマスがキーボードの下に隠れて見えなくなる。
    // 見えている高さを --vvh に流し込み、body の高さをそれに合わせる。
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var root = document.documentElement;
      var sync = function () {
        // ピンチで拡大している間も visualViewport は小さくなる。
        // それを高さとして採用すると「拡大するほど画面が縮む」ため、
        // 縮めるのはキーボードが出ているとき（等倍のとき）だけにする。
        if (vv.scale > 1.01) root.style.removeProperty('--vvh');
        else root.style.setProperty('--vvh', Math.round(vv.height) + 'px');
      };
      vv.addEventListener('resize', sync);
      vv.addEventListener('scroll', sync);
      sync();
    })();
  </script>

  <script>
    // 新しい版が裏で用意できたら、児童にも分かる言葉で知らせてから入れ替える。
    // 黙って入れ替えると、書きかけの作文を抱えたまま画面が変わって驚くので、
    // 「いつ更新するか」は本人に押してもらう。
    // そのために sw.js の install では skipWaiting() を呼ばず、待機させている。
    window.__pwaApplyUpdate = function () {};
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          const announce = (waiting) => {
            if (!waiting) return;
            window.__pwaApplyUpdate = function () {
              // controllerchange を待ってから再読み込みする。
              // 先に reload すると古い方の Service Worker が応答し、
              // 「更新したのに変わらない」が起きる。
              navigator.serviceWorker.addEventListener('controllerchange', function once() {
                navigator.serviceWorker.removeEventListener('controllerchange', once);
                location.reload();
              });
              waiting.postMessage({ type: 'SKIP_WAITING' });
            };
            window.dispatchEvent(new Event('pwa-update-ready'));
          };

          // ページを開いた時点ですでに新しい版が待機していることがある
          if (reg.waiting && navigator.serviceWorker.controller) announce(reg.waiting);

          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              // controller がある＝初回インストールではなく「更新」のときだけ知らせる
              if (sw.state === 'installed' && navigator.serviceWorker.controller) announce(sw);
            });
          });
        }).catch(() => {});
      });
    }
  </script>
</head>
<!-- 高さは head の body.app-shell 側で決める。ここに h-[100dvh] を残すと
     ソフトキーボード対応(--vvh)がクラス側に負けて効かなくなる。 -->
<body class="app-shell bg-slate-50 text-slate-800 font-sans flex flex-col overflow-hidden selection:bg-blue-200 selection:text-blue-900">
  <div id="root" class="h-full flex flex-col"></div>

  <!-- 画面の中身。原本は src/app.jsx（ここは生成物 js/app.js を読むだけ） -->
  <script src="./js/app.js"></script>

  <!-- 利用規約・プライバシーへの行き先。中身は正本の部品
       standards/web/giga-app-links.js（配布物 web/giga-app-links.js）が、
       src/app.jsx のフッターに置いた <span data-giga-links> の中に出す。
       data-links は置き場所の側に書いてある。 -->
  <script src="./web/giga-app-links.js" defer></script>
</body>
</html>
